name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: 'npm'
      - name: Print versions
        run: |
          node --version
          npm --version
          npm install -g npm@11
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: V1 customer surface regression
        run: npm run test:v1-surface
      - name: Cross-workspace UI state regression
        run: npm run test:ui-state

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'
      - name: Print versions
        run: |
          node --version
          npm --version
          npm install -g npm@11
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: npm run check
      - name: SQL draft source preflight
        run: node scripts/checkDatabaseDrafts.js
      - name: Test
        run: npm test
